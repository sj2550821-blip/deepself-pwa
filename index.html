<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Deepself</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f9a84d">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#1a2e45; }
iframe { width:100%; height:100%; border:none; display:block; }
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbwQ39noDOXgrGkbJne2ylNUYptsAHiKM6_6pnu1ORqMq9dGRRaIdpPpZOYAXq5vVYcluw/exec"
    allow="autoplay; microphone"></iframe>

<script>
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQ39noDOXgrGkbJne2ylNUYptsAHiKM6_6pnu1ORqMq9dGRRaIdpPpZOYAXq5vVYcluw/exec";
var IFRAME_ORIGIN = "https://script.google.com";
var iframeEl = document.querySelector('iframe');
var mediaRecorder = null, audioChunks = [], isRecording = false;

function postToIframe(msg){
  if (iframeEl && iframeEl.contentWindow) {
    iframeEl.contentWindow.postMessage(msg, IFRAME_ORIGIN);
  }
}

window.addEventListener('message', function(e){
  if (e.origin !== IFRAME_ORIGIN) return;
  var data = e.data || {};
  if (data.type === 'deepself-mic-toggle') {
    if (!isRecording) { startRecording(); } else { stopRecording(); }
  }
});

function startRecording(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    postToIframe({type:'deepself-mic-result', success:false, error:'unsupported'});
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    isRecording = true;
    postToIframe({type:'deepself-mic-state', state:'recording'});
    audioChunks = [];
    var mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) ? 'audio/webm;codecs=opus'
      : (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/mp4')) ? 'audio/mp4' : '';
    mediaRecorder = mimeType ? new MediaRecorder(stream, {mimeType: mimeType}) : new MediaRecorder(stream);
    mediaRecorder.ondataavailable = function(ev){ if (ev.data.size > 0) audioChunks.push(ev.data); };
    mediaRecorder.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      var blob = new Blob(audioChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      sendAudio(blob);
    };
    mediaRecorder.start();
  }).catch(function(){
    isRecording = false;
    postToIframe({type:'deepself-mic-result', success:false, error:'denied'});
  });
}

function stopRecording(){
  if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
  isRecording = false;
  postToIframe({type:'deepself-mic-state', state:'transcribing'});
  mediaRecorder.stop();
}

function sendAudio(blob){
  var reader = new FileReader();
  reader.onloadend = function(){
    var base64 = reader.result.split(',')[1];
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'transcribeAudio', base64Audio: base64, mimeType: blob.type || 'audio/webm'})
    }).then(function(res){ return res.json(); })
      .then(function(data){
        postToIframe({type:'deepself-mic-result', success: !!(data && data.success), text: (data && data.text) || ''});
      }).catch(function(){
        postToIframe({type:'deepself-mic-result', success:false, error:'network'});
      });
  };
  reader.readAsDataURL(blob);
}
</script>
</body>
</html>
